[package]
name = "sqlite-parquet"
version = "0.1.0"
edition = "2021"

[dependencies]
sqlite-loadable = {path="../sqlite-loadable-rs", features=["exec"]}
# All compression codecs are enabled so arbitrary parquet files can be read.
parquet = {version="59.2.0", default-features=false, features=["arrow", "snap", "zstd", "lz4", "brotli", "flate2-zlib-rs"]}
arrow = {version="59.2.0", default-features=false}
chrono = "0.4"
serde_json = "1.0"
glob = "0.3"

[lib]
crate-type=["lib", "cdylib", "staticlib"]
